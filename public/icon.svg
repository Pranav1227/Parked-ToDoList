<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft paper drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1F2328" flood-opacity="0.18" />
    </filter>
    <!-- Subtle gradient for sticky peel -->
    <linearGradient id="stickyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="100%" stop-color="#FFE885" />
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.45" />
    </linearGradient>
  </defs>

  <!-- Desk background square (calm dark-forest / warm-desk tone) -->
  <rect width="512" height="512" rx="100" fill="#2F6F5E" />

  <!-- Main tilted sticky note -->
  <g transform="rotate(-3 256 256)">
    <rect x="96" y="96" width="320" height="320" rx="16" fill="url(#stickyGrad)" filter="url(#shadow)" />
    
    <!-- Translucent desk tape at the top center -->
    <rect x="206" y="78" width="100" height="34" rx="4" fill="url(#tapeGrad)" transform="rotate(2 256 95)" />

    <!-- Ruled or hand-written visual lines -->
    <!-- Pin accent dot -->
    <circle cx="150" cy="156" r="10" fill="#2F6F5E" />
    <text x="160" y="164" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" letter-spacing="1" fill="#2B2B2B">TASKDOCK</text>
    
    <rect x="140" y="210" width="232" height="12" rx="6" fill="#D4BE54" opacity="0.65" />
    <rect x="140" y="250" width="190" height="12" rx="6" fill="#D4BE54" opacity="0.65" />
    <rect x="140" y="290" width="215" height="12" rx="6" fill="#D4BE54" opacity="0.65" />
    <rect x="140" y="330" width="130" height="12" rx="6" fill="#D4BE54" opacity="0.65" />

    <!-- Mini checkmark in bottom right -->
    <circle cx="360" cy="360" r="22" fill="#2F6F5E" />
    <path d="M350 360 L357 367 L372 352" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
